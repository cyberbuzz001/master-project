# ── Multi-Core Clustered Upstreams ──────────────────────────────────────────
upstream tradegrow_api_cluster {
    least_conn;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5004 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream tradegrow_ws_cluster {
    ip_hash;
    server 127.0.0.1:5001 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:5002 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:5003 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:5004 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

server {
    server_name tradegrowx.in www.tradegrowx.in 200.234.34.4;

    root /opt/tradegrow/client/dist;
    index index.html;

    client_max_body_size 20M;

    # Gzip Compression for high-throughput responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;

    # 1. Real-Time WebSockets (Clustered with session affinity)
    location /ws {
        proxy_pass http://tradegrow_ws_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. Backend REST API (Least-connection load balancing with connection keepalive)
    location /api/ {
        proxy_pass http://tradegrow_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 2b. Internal Advisory & Meta WhatsApp Webhook Routes
    location /internal/ {
        proxy_pass http://tradegrow_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 3. Static Assets (Cached with Immutable header)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 4. SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tradegrowx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradegrowx.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tradegrowx.in www.tradegrowx.in 200.234.34.4;
    return 301 https://tradegrowx.in$request_uri;
}
