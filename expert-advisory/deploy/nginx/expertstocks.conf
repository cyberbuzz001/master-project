# Expert Stocks Consultancy — Nginx site (Ubuntu 24.04, PHP 8.3-FPM, Next.js on :3000)
# Same-origin routing: /api, /sanctum, /webhooks -> Laravel; everything else -> Next.js.

upstream nextjs { server 127.0.0.1:3000; keepalive 32; }

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name expertstocks.in www.expertstocks.in;
    return 301 https://expertstocks.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.expertstocks.in;
    ssl_certificate     /etc/ssl/cloudflare/expertstocks.pem;
    ssl_certificate_key /etc/ssl/cloudflare/expertstocks.key;
    return 301 https://expertstocks.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name expertstocks.in;

    # Cloudflare origin certificate; enable Authenticated Origin Pulls in Cloudflare.
    ssl_certificate     /etc/ssl/cloudflare/expertstocks.pem;
    ssl_certificate_key /etc/ssl/cloudflare/expertstocks.key;
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Restore visitor IPs from Cloudflare (keep the IP list current: https://www.cloudflare.com/ips/).
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    set $laravel_root /srv/expertstocks/current/backend/public;

    # Retired pages from the previous website builder.
    location ~ ^/(classic-cap-hpeszv|face-serum-gxrcld|handmade-vase-slowpy|hand-soap-giguos|set-of-plates-cxlzwx|sunglasses-iubjnq|wooden-chair-mopukh|wool-sweater-lortoo)$ {
        return 410;
    }

    location = /api/v1/auth/login { limit_req zone=auth burst=5 nodelay; try_files $uri @laravel; }
    location = /api/v1/public/leads { limit_req zone=auth burst=5 nodelay; try_files $uri @laravel; }

    location ~ ^/(api|sanctum|webhooks)/ {
        limit_req zone=api burst=40 nodelay;
        try_files $uri @laravel;
    }

    # Staff back-office (Filament) and its Livewire endpoints.
    location ~ ^/(office|filament|livewire-[a-f0-9]+)(/|$) {
        limit_req zone=api burst=40 nodelay;
        try_files $uri @laravel;
    }

    # Published Filament assets served straight from Laravel's public directory.
    location ~ ^/(css|js|fonts)/filament/ {
        root $laravel_root;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location @laravel {
        root $laravel_root;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $laravel_root/index.php;
        fastcgi_param DOCUMENT_ROOT $laravel_root;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm-expertstocks.sock;
        fastcgi_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://nextjs;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ /\.(?!well-known) { deny all; }
}
