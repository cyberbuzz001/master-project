# Expert Stocks Laravel API virtual host.
# Next.js remains on Vercel at www.expertstocks.in.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.expertstocks.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.expertstocks.in;

    ssl_certificate /etc/ssl/cloudflare/expertstocks.pem;
    ssl_certificate_key /etc/ssl/cloudflare/expertstocks.key;
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    server_tokens off;
    root /srv/expertstocks/current/backend/public;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location = /api/v1/auth/login {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri @laravel;
    }

    location = /api/v1/public/leads {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri @laravel;
    }

    location ~ ^/(api|sanctum|webhooks|office|filament|livewire-[a-f0-9]+)(/|$) {
        limit_req zone=api burst=40 nodelay;
        try_files $uri @laravel;
    }

    location ~ ^/(css|js|fonts)/filament/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        try_files $uri =404;
    }

    location / {
        try_files $uri @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/expertstocks/current/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/expertstocks/current/backend/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/run/php/php8.3-fpm-expertstocks.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
