; Queue workers and scheduler for Expert Stocks Consultancy.
; Queues: critical (payments/webhooks), default, comms, ai, reports, ingest.

[program:esc-queue-critical]
command=/usr/bin/php /srv/expertstocks/current/backend/artisan queue:work redis --queue=critical --tries=5 --backoff=10,60,300 --max-time=3600 --sleep=1
user=expertstocks
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/srv/expertstocks/shared/backend/storage/logs/queue-critical.log

[program:esc-queue-default]
command=/usr/bin/php /srv/expertstocks/current/backend/artisan queue:work redis --queue=default,comms --tries=3 --backoff=30,120,600 --max-time=3600
user=expertstocks
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/srv/expertstocks/shared/backend/storage/logs/queue-default.log

[program:esc-queue-background]
command=/usr/bin/php /srv/expertstocks/current/backend/artisan queue:work redis --queue=ai,reports,ingest --tries=3 --backoff=30,120,600 --timeout=300 --max-time=3600
user=expertstocks
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/srv/expertstocks/shared/backend/storage/logs/queue-background.log

[program:esc-scheduler]
command=/usr/bin/php /srv/expertstocks/current/backend/artisan schedule:work
user=expertstocks
numprocs=1
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/srv/expertstocks/shared/backend/storage/logs/scheduler.log
