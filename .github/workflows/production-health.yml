name: Expert Stocks Production Health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check public website
        run: curl --fail --silent --show-error --max-time 20 -I https://www.expertstocks.in/
      - name: Check Laravel API
        run: curl --fail --silent --show-error --max-time 20 https://api.expertstocks.in/api/v1/health
