# Local parity services: MySQL 8, Redis 7, Mailpit.
# Usage: docker compose -f deploy/docker-compose.yml up -d
# Then in backend/.env: DB_CONNECTION=mysql, DB_HOST=127.0.0.1, DB_DATABASE=expertstocks,
# DB_USERNAME=expertstocks, DB_PASSWORD=expertstocks, QUEUE_CONNECTION=redis, CACHE_STORE=redis,
# MAIL_MAILER=smtp, MAIL_PORT=1025
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: expertstocks
      MYSQL_USER: expertstocks
      MYSQL_PASSWORD: expertstocks
      MYSQL_ROOT_PASSWORD: root-local-only
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  mysql-data:
  redis-data:
