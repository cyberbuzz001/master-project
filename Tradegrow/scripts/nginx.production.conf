# ==============================================================================
# Trade Grow — High-Concurrency NGINX Reverse Proxy & Load Balancer
# File: /etc/nginx/nginx.conf (or /etc/nginx/sites-available/tradegrow)
#
# Performance & Architecture Highlights:
#   - 65,535 concurrent connections per worker with epoll event loop
#   - CPU affinity and zero-copy packet transmission (sendfile + tcp_nodelay)
#   - 50MB shared TLS 1.3 session caching for zero-handshake reconnection
#   - Persistent HTTP/1.1 upstream connection pooling (keepalive 512)
#   - Zero-buffering WebSocket streaming tunnel for Dhan HQ live ticks
#   - Tiered Rate Limiting Zones (Auth: 30r/m, Orders: 120r/m, General APIs: 600r/m)
# ==============================================================================

user nginx;
pid /var/run/nginx.pid;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── High-Throughput Socket & Transmission Tuning ───────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # ── Buffer & Request Memory Allocations ────────────────────────────────────
    client_body_buffer_size 128k;
    client_max_body_size 15m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;

    # ── Compression (Static assets & REST payloads) ────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Zero-Handshake TLS 1.3 Session Caching ────────────────────────────────
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Tiered Rate Limiting Zones ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:20m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=order_limit:20m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:40m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:20m rate=60r/m;

    # ── Upstream Node.js Trading Engine Cluster ───────────────────────────────
    upstream tradegrow_cluster {
        least_conn;
        server 127.0.0.1:5000 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=5s;
        keepalive 512;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP (Port 80) → HTTPS (Port 443) Automatic Redirect ──────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name tradegrowx.in www.tradegrowx.in;

        # Certbot ACME challenge location
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (Port 443) Main Trading Platform ────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name tradegrowx.in www.tradegrowx.in;

        ssl_certificate     /etc/letsencrypt/live/tradegrowx.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tradegrowx.in/privkey.pem;

        # Strict Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── 1. Real-Time WebSocket Tunneling (Dhan HQ Ticks) ──────────────────
        location /ws {
            limit_req zone=ws_limit burst=10 nodelay;

            proxy_pass         http://tradegrow_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Zero-Buffering for instant market tick delivery
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── 2. Critical Order Placement API ───────────────────────────────────
        location ~ ^/api/v1/orders {
            limit_req zone=order_limit burst=20 nodelay;

            proxy_pass         http://tradegrow_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # ── 3. Authentication Endpoints (Brute-force protection) ──────────────
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass         http://tradegrow_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # ── 4. Market Data — Option Chain (Dynamic Greeks Matrix) ─────────────
        location ~ ^/api/v1/market/option(chain|-chain|-expiries) {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass         http://tradegrow_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── 5. Health & Diagnostic Probes (No Rate Limiting) ──────────────────
        location ~ ^/api/v1/health/(live|ready|dependencies|pipeline) {
            proxy_pass         http://tradegrow_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_read_timeout 5s;
        }

        # ── 6. General REST APIs ──────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass         http://tradegrow_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── 7. Frontend SPA & Static Asset Distribution ───────────────────────
        location / {
            proxy_pass         http://tradegrow_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;

            # Aggressive caching for immutable static builds
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass         http://tradegrow_cluster;
                proxy_http_version 1.1;
                proxy_set_header   Connection "";
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
