networks:
  trading-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  kyc_uploads:

services:
  # ============================================================
  # PostgreSQL — Primary Database (TimescaleDB for time-series)
  # ============================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tradegrow_postgres
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=8GB"
      - "-c"
      - "effective_cache_size=24GB"
      - "-c"
      - "maintenance_work_mem=2GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=16GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_connections=300"
    environment:
      POSTGRES_DB:       ${PG_DATABASE:-tradegrow}
      POSTGRES_USER:     ${PG_USER:-tradegrow}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-tradegrow} -d ${PG_DATABASE:-tradegrow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10g
        reservations:
          memory: 4g

  # ============================================================
  # PgBouncer — Production Connection Pooler & Multiplexer
  # ============================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: tradegrow_pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${PG_USER:-tradegrow}
      DB_PASSWORD: ${PG_PASSWORD}
      DB_NAME: ${PG_DATABASE:-tradegrow}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 600
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  # ============================================================
  # Redis — Cache, Pub/Sub, Rate Limiting
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: tradegrow_redis
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g

  # ============================================================
  # Python FastAPI Options Math Engine
  # ============================================================
  python-engine:
    build:
      context: ./python_engine
      dockerfile: Dockerfile
    container_name: tradegrow_python_engine
    environment:
      PYTHON_PORT: 8000
      REDIS_URL:   redis://redis:6379
      ANGELONE_API_KEY:      ${ANGELONE_API_KEY}
      ANGELONE_CLIENT_ID:    ${ANGELONE_CLIENT_ID}
      ANGELONE_CLIENT_SECRET: ${ANGELONE_CLIENT_SECRET}
      ANGELONE_TOTP_SECRET:  ${ANGELONE_TOTP_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g

  # ============================================================
  # Trade Grow — Main Application Server (Node.js + React SPA)
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradegrow_app
    env_file:
      - .env
    environment:
      PORT:                         5000
      NODE_ENV:                     production
      REAL_MONEY_TRADING:           "false"
      PRIMARY_MARKET_DATA_PROVIDER: ${PRIMARY_MARKET_DATA_PROVIDER:-ANGELONE}
      # Secrets from .env file (uploaded to VPS, never in Git)
      JWT_SECRET:                   ${JWT_SECRET}
      JWT_REFRESH_SECRET:           ${JWT_REFRESH_SECRET}
      DEFAULT_VIRTUAL_CAPITAL:      "1000000"
      # AI Support Bot (Live Chat - Claude + Gemini Dual Engine)
      ANTHROPIC_API_KEY:            ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL:              ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      GEMINI_API_KEY:               ${GEMINI_API_KEY}
      GEMINI_MODEL:                 ${GEMINI_MODEL:-gemini-3.6-flash}
      # Reject orders placed outside market hours (see utils/marketHours.ts)
      ENFORCE_MARKET_HOURS:         ${ENFORCE_MARKET_HOURS:-true}
      # Dhan API
      DHAN_CLIENT_ID:               ${DHAN_CLIENT_ID}
      DHAN_ACCESS_TOKEN:            ${DHAN_ACCESS_TOKEN}
      DHAN_API_KEY:                 ${DHAN_API_KEY}
      DHAN_API_SECRET:              ${DHAN_API_SECRET}
      # Telegram Alerts
      TELEGRAM_BOT_TOKEN:           ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID:             ${TELEGRAM_CHAT_ID}
      # Angel One (fallback)
      ANGELONE_API_KEY:             ${ANGELONE_API_KEY}
      ANGELONE_CLIENT_ID:           ${ANGELONE_CLIENT_ID}
      ANGELONE_CLIENT_SECRET:       ${ANGELONE_CLIENT_SECRET}
      ANGELONE_TOTP_SECRET:         ${ANGELONE_TOTP_SECRET}
      SMARTAPI_API_KEY:             ${SMARTAPI_API_KEY}
      SMARTAPI_CLIENT_CODE:         ${SMARTAPI_CLIENT_CODE}
      SMARTAPI_PASSWORD:            ${SMARTAPI_PASSWORD}
      SMARTAPI_TOTP_SECRET:         ${SMARTAPI_TOTP_SECRET}
      # Alpha Vantage
      ALPHAVANTAGE_API_KEY:         ${ALPHAVANTAGE_API_KEY}
      # TrueData
      TRUEDATA_USERNAME:            ${TRUEDATA_USERNAME}
      TRUEDATA_PASSWORD:            ${TRUEDATA_PASSWORD}
      TRUEDATA_WS_URL:              ${TRUEDATA_WS_URL:-wss://replay.truedata.in:8082}
      ALLOW_OFF_MARKET_LIVE_DATA:   "true"
      # PostgreSQL
      DATABASE_URL:                 ${DATABASE_URL}
      PG_HOST:                      ${PG_HOST:-postgres}
      PG_PORT:                      "5432"
      PG_DATABASE:                  ${PG_DATABASE:-tradegrow}
      PG_USER:                      ${PG_USER:-tradegrow}
      PG_PASSWORD:                  ${PG_PASSWORD}
      PG_POOL_MAX:                  "50"
      PG_POOL_MIN:                  "5"
      # Redis
      REDIS_URL:                    redis://redis:6379
      REDIS_HOST:                   redis
      REDIS_PORT:                   "6379"
      # CORS — set to your actual domain
      ALLOWED_ORIGINS:              ${ALLOWED_ORIGINS:-http://localhost:5000}
      NODE_OPTIONS:                 "--max-old-space-size=16384"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - kyc_uploads:/app/server/uploads/kyc
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 18g
        reservations:
          memory: 4g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
