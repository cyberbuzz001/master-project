name: database-ci

on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brokerage
          POSTGRES_USER: brokerage
          POSTGRES_PASSWORD: brokerage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brokerage -d brokerage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://brokerage:brokerage@localhost:5432/brokerage?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm test
