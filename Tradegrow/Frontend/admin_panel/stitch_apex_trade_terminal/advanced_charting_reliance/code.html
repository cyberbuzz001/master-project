<!-- Crosshair Script -->
<script>
        const chartArea = document.getElementById('chart-area');
        
        // Simple crosshair simulation
        const hLine = document.createElement('div');
        const vLine = document.createElement('div');
        
        [hLine, vLine].forEach(line => {
            line.className = 'absolute bg-outline-variant/40 pointer-events-none z-20';
            chartArea.appendChild(line);
        });
        
        hLine.style.height = '1px';
        hLine.style.width = '100%';
        vLine.style.width = '1px';
        vLine.style.height = '100%';
        
        chartArea.addEventListener('mousemove', (e) => {
            const rect = chartArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            hLine.style.top = `${y}px`;
            vLine.style.left = `${x}px`;
        });

        // Touch events for mobile crosshair
        chartArea.addEventListener('touchmove', (e) => {
            const rect = chartArea.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            hLine.style.top = `${y}px`;
            vLine.style.left = `${x}px`;
            e.preventDefault();
        }, { passive: false });
    </script>
